name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      # The shipped binary is a release build assembled by build-app.sh; a debug-only CI lets
      # release-configuration and bundle/codesign regressions ship untested.
      - name: Assemble release bundle
        run: ./build-app.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build/HiDisplay.app
